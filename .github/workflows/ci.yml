name: CI

on:
  # Every pull request is checked, whatever its base, and so is every push to a
  # branch that will become one — work is verified before review, not after.
  # (Until 2026-10-20 only `main` triggered CI, so 82 deployed commits on phase
  # branches never ran here.)
  push:
    branches: [main, 'fix/**', 'feature/**', 'release/**']
  pull_request:
  # The browser job is heavy (it builds and boots the whole Compose stack), so
  # it is opt-in rather than on every push. See the `e2e` job below.
  workflow_dispatch:
    inputs:
      run_browser_suite:
        description: 'Also run the Playwright E2E + accessibility suites'
        type: boolean
        default: false

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scc26
          POSTGRES_DB: school_it_service_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The Gemini concurrency limiter is a Redis funnel shared across worker
      # processes; GeminiConcurrencyTest proves the cap against a real server,
      # as the local isolated gate (scripts/lib/isolated-gate.sh) already does.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, mbstring, intl, zip, bcmath, gd, pcntl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Tests (Pest)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
        run: vendor/bin/pest

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Playwright's own browsers are never used: the suites run against the
        # Alpine Chromium baked into the node image (docker/node/Dockerfile).
        # Without this, `npm ci` would download ~400 MB of unusable binaries.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Types (tsc)
        run: npx tsc -b

      - name: Tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  #  Browser verification (WP-2.7d) — opt-in.
  #
  #  Runs the committed Playwright suites against a real Compose stack, which
  #  is the only way they can run: they need nginx, php-fpm, PostgreSQL, Redis
  #  and the seeded fixtures. That costs several minutes, so it is triggered
  #  deliberately rather than on every push.
  #
  #  Since the local development stack was retired (2026-10-10) this job is the
  #  only place the e2e/a11y suites still run. compose.yaml's services sit
  #  behind the `dev` profile so a bare local `docker compose up` cannot
  #  recreate that stack; here, on a disposable runner, the profile and
  #  scripts/lib/stack.sh's dev path are enabled on purpose.
  # ---------------------------------------------------------------
  e2e:
    name: Browser E2E + accessibility
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_browser_suite
    env:
      COMPOSE_PROFILES: dev
      SCCIT_ALLOW_DEV_STACK: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          # backend/.env.example leaves the Reverb app credentials empty; with no
          # key /api/broadcasting/config answers 503 and the browser falls back
          # to polling, slower than the realtime specs wait. Throwaway values
          # for this disposable stack only.
          for key in REVERB_APP_ID REVERB_APP_KEY REVERB_APP_SECRET; do
            sed -i "s/^${key}=.*/${key}=$(openssl rand -hex 12)/" backend/.env
          done

      - name: Start a disposable stack (compose.yaml, dev profile)
        run: |
          # compose.yaml bind-mounts backend/ and frontend/ (it was the live
          # development stack), so nothing installed in an image is visible
          # there: vendor/ must be installed into the mounted checkout, by the
          # container's user (uid 1000), which is not the runner's uid.
          chmod -R a+rwX backend frontend
          docker compose up -d --build
          docker compose exec -T app composer install --no-interaction --prefer-dist --no-progress
          docker compose exec -T app php artisan key:generate
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:seed --force
          # The workers and Reverb started before vendor/ existed and are in
          # Docker's restart backoff; recreate them now that it does, or every
          # realtime and queued-notification assertion waits on nothing.
          docker compose up -d --force-recreate --no-deps queue queue_ai scheduler reverb
          docker compose ps

      - name: E2E suite
        run: sh scripts/e2e.sh --project e2e

      - name: Accessibility suite
        run: sh scripts/e2e.sh --project a11y

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/e2e/.artifacts/
          retention-days: 7

  # ---------------------------------------------------------------
  #  Secret scan. The repository is public, so a credential in any commit is
  #  published. Scans the full history (fetch-depth 0) with the default
  #  gitleaks rules plus the narrow fixture allowlist in .gitleaks.toml.
  #  Runs the pinned container image: no third-party action, no licence key,
  #  and --redact keeps any finding's value out of the public job log.
  # ---------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  # ---------------------------------------------------------------
  #  The Render pilot image (docker/render/), built and booted the way the
  #  free tier runs it — 512 MB, 0.1 CPU — against throwaway Postgres
  #  (pgvector), an S3 stub and Mailpit, then smoke-tested with a real
  #  sign-in and a WebSocket handshake. Synthetic data; nothing leaves the
  #  runner. Keeps the pilot packaging from rotting between deploys.
  # ---------------------------------------------------------------
  render-image:
    name: Render image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docker/render/Dockerfile
        run: docker build -f docker/render/Dockerfile -t sccit/render:ci .

      - name: Boot it under free-tier limits
        run: |
          set -eu
          DBPASS="$(openssl rand -hex 16)"
          docker network create rt
          docker run -d --name rt_db --network rt -e POSTGRES_PASSWORD="$DBPASS" -e POSTGRES_DB=pilot pgvector/pgvector:pg17
          docker run -d --name rt_s3 --network rt --network-alias s3mock -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=pilot-files adobe/s3mock
          docker run -d --name rt_mail --network rt --network-alias mailpit axllent/mailpit
          for i in $(seq 1 60); do docker exec rt_db pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name rt_app --network rt -p 127.0.0.1:18090:10000 --memory=512m --cpus=0.1 \
            -e APP_ENV=production -e APP_DEBUG=false -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://localhost:18090 -e FRONTEND_URL=http://localhost:18090 -e TRUST_PROXIES='*' \
            -e LOG_CHANNEL=stderr -e SESSION_DRIVER=database -e SESSION_SECURE_COOKIE=false \
            -e SANCTUM_STATEFUL_DOMAINS=localhost:18090 -e CACHE_STORE=database -e QUEUE_CONNECTION=database \
            -e DB_QUEUE_RETRY_AFTER=240 -e AI_GEMINI_CONCURRENCY=0 \
            -e DB_CONNECTION=pgsql -e DB_HOST=rt_db -e DB_PORT=5432 -e DB_DATABASE=pilot -e DB_USERNAME=postgres -e DB_PASSWORD="$DBPASS" \
            -e ATTACHMENTS_DISK=s3 -e AWS_ACCESS_KEY_ID=ci -e AWS_SECRET_ACCESS_KEY=ci -e AWS_DEFAULT_REGION=us-east-1 \
            -e AWS_BUCKET=pilot-files -e AWS_ENDPOINT=http://s3mock:9090 -e AWS_USE_PATH_STYLE_ENDPOINT=true \
            -e BROADCAST_CONNECTION=reverb -e REVERB_APP_ID=1 -e REVERB_APP_KEY=cikey -e REVERB_APP_SECRET="$(openssl rand -hex 12)" \
            -e REVERB_HOST=127.0.0.1 -e REVERB_PORT=6001 -e REVERB_SCHEME=http -e REVERB_ALLOWED_ORIGINS=localhost \
            -e MAIL_MAILER=smtp -e MAIL_HOST=mailpit -e MAIL_PORT=1025 -e MAIL_FROM_ADDRESS=noreply@ci.example \
            -e ADMIN_EMAIL=ci.admin@ci.example -e ADMIN_PASSWORD=Ci-Admin-Passw0rd! \
            -e RUN_MIGRATIONS=1 -e RUN_FIRST_INSTALL=1 \
            sccit/render:ci
          for i in $(seq 1 60); do curl -fsS -o /dev/null --max-time 5 http://localhost:18090/up && break; sleep 5; done
          docker exec rt_app supervisorctl status

      - name: Smoke test, sign-in, WebSocket, memory
        run: |
          set -eu
          sh scripts/smoke.sh --url http://localhost:18090 --email ci.admin@ci.example --password 'Ci-Admin-Passw0rd!'
          curl -sS -i -N --max-time 5 -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' \
            -H "Sec-WebSocket-Key: $(openssl rand -base64 16)" -H 'Origin: http://localhost:18090' \
            'http://localhost:18090/reverb/app/cikey?protocol=7&client=js&version=8.4.0' | head -1 | grep -q ' 101 '
          echo "WebSocket upgrade: 101"
          curl -sSI http://localhost:18090/ | grep -qi '^strict-transport-security'
          docker stats --no-stream --format 'memory: {{.MemUsage}}' rt_app

      - name: Container log on failure
        if: failure()
        run: docker logs rt_app 2>&1 | tail -150
