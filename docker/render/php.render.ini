; =============================================================
;  SccIT PHP — Render free-tier sizing (512 MB RAM, 0.1 CPU).
;  Loaded after zz-sccit.ini and zzz-sccit-prod.ini, so it wins.
;
;  Everything shares one container: php-fpm, a queue worker, the
;  scheduler and Reverb. The Docker stack's per-process budget (512M,
;  256 MB OPcache + 128 MB JIT per FPM container) would not fit at all.
; =============================================================

; One process may use at most half the instance. Report documents are capped
; to fit (REPORT_PAGED_ROW_BUDGET / REPORT_XLSX_CELL_BUDGET in render.yaml).
memory_limit = 256M

; Shared by FPM workers only (CLI has OPcache off). JIT off: its buffer is
; reserved memory, and a 0.1 CPU instance gains little from it.
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
opcache.jit = disable
opcache.jit_buffer_size = 0
