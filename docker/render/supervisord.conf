; =============================================================
;  Processes of the Render free-tier container. Each restarts on its own;
;  all logs go to the container's stdout/stderr (Render's log stream).
;  Laravel processes run as appuser, never root.
; =============================================================
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Realtime: reached only through nginx's /reverb/app/ on the public port.
[program:reverb]
command=php /var/www/html/artisan reverb:start --host=127.0.0.1 --port=6001
user=appuser
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One worker for every queue (the Docker stack runs four). Order matters:
; live updates and mail before documents and AI. --timeout exceeds the longest
; job (180 s) and DB_QUEUE_RETRY_AFTER (240 s) exceeds --timeout, so a running
; job is never handed out twice. --memory recycles the worker before it
; crowds the instance.
[program:queue]
command=php /var/www/html/artisan queue:work --queue=realtime,notifications,default,bulk,ai --sleep=3 --tries=3 --timeout=190 --max-time=3600 --memory=160
user=appuser
priority=40
autorestart=true
stopwaitsecs=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The only scheduler in this deployment (onOneServer locks use the database
; cache). Runs while the instance is awake; every scheduled task is a sweep,
; so a run missed during spin-down is caught up by the next one.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=appuser
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
