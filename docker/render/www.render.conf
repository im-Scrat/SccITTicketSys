; =============================================================
;  PHP-FPM pool — Render free-tier pilot.
;  nginx runs in the same container, so FPM listens on loopback only.
;  `ondemand`: no idle workers holding memory; at most four requests
;  are served at once on a 0.1 CPU instance, and that is plenty.
; =============================================================
[www]
user = appuser
group = appuser
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 200

ping.path = /ping
ping.response = pong

; Keep the environment Render injects (DB_*, MAIL_*, …) visible to PHP.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
