[www]
user = appuser
group = appuser

listen = 0.0.0.0:9000

; Process manager tuning (sane dev defaults)
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Status + ping endpoints (ping is used by the container healthcheck)
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Pass container env through; surface worker output to docker logs
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
