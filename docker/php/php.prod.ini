; =============================================================
;  SccIT PHP runtime — PRODUCTION overrides.
;  Loaded AFTER zz-sccit.ini (base) as zzz-sccit-prod.ini, so these
;  win. Applied ONLY in the Dockerfile `production` stage — the dev
;  image never sees this file, so daily HMR/code-reload is unchanged.
;
;  The production image bakes the source into an immutable image layer
;  (no bind mount), which makes the settings below safe.
; =============================================================

; ---- OPcache (production: trust the baked, immutable code) ----
; The single biggest backend win: stop stat()-ing every included file on
; every request. Safe because a new image is built per release; code never
; changes under a running container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.max_wasted_percentage = 10
; Keep doc-comments: Laravel + attribute-based packages read them via reflection.
opcache.save_comments = 1
opcache.enable_file_override = 1
; Tracing JIT for a CPU bump on hot paths.
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; ---- realpath cache: fewer path lookups per request ----
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ---- Errors: never leak to the client in production ----
display_errors = Off
display_startup_errors = Off
log_errors = On

; ---- Exceptions: no argument values in stack traces ----
; With this Off, every trace frame prints the first characters of each string
; argument. A failed SMTP AUTH LOGIN frame then carries the start of the
; base64-encoded password into the log and into failed_jobs.exception
; (verified 2026-10-20). The application also redacts configured secrets from
; logs and failed jobs; this removes the argument values at the source.
zend.exception_ignore_args = On
