; ---- SccIT PHP runtime defaults (loaded last, overrides base) ----
memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 120
max_input_vars = 5000
date.timezone = UTC
expose_php = Off

; ---- OPcache (dev-friendly: revalidate so code edits apply) ----
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; JIT for a perf bump; safe to keep on in dev.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; ---- Errors: visible in dev, captured by Laravel/logs ----
display_errors = Off
log_errors = On
error_reporting = E_ALL
