# =============================================================
#  SccIT — single-origin Nginx site.
#  Browser hits ONLY http://localhost:8080:
#    /api, /sanctum, /up, /storage,
#    /broadcasting                  -> Laravel (php-fpm @ app:9000)
#    /reverb/app/  (WebSocket)      -> Reverb (reverb:6001, internal only)
#    everything else                -> Vite dev server (node:5173)
#  No CORS; Sanctum cookies are first-party.
# =============================================================

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    # Security response headers — compose mounts security-headers.dev.conf at
    # this path. One server-level include is enough here because no location
    # below declares an add_header of its own; nginx discards inherited
    # add_header directives in any block that declares one.
    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS — lets us resolve "node" at request time so
    # Nginx still starts even before the frontend container exists.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Laravel-served static uploads (storage symlink) ----
    location ^~ /storage/ {
        try_files $uri =404;
    }

    # ---- Laravel backend routes ----
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }
    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
    }
    location = /up {
        try_files $uri /index.php?$query_string;
    }
    # Private-channel authorization (GET|POST /broadcasting/auth). Without this
    # it falls through to `location /` and the Vite dev server answers with the
    # SPA's index.html — a 200 that Echo then fails to parse as JSON.
    location ^~ /broadcasting/ {
        try_files $uri /index.php?$query_string;
    }

    # ---- Reverb WebSocket (same-origin; Reverb has no published port) ----
    # Only the Pusher-protocol socket path /app/{key} is proxied. Reverb's HTTP
    # publishing API (/apps/{id}/…) is deliberately NOT reachable through
    # here: Laravel calls it directly over the compose network, and nothing in
    # a browser has any business near it.
    #
    # The upstream is a variable so nginx starts even when reverb is down, and
    # a variable proxy_pass does not do prefix substitution — hence the
    # explicit rewrite dropping /reverb before the request is forwarded.
    location ^~ /reverb/app/ {
        set $reverb_upstream http://reverb:6001;
        rewrite ^/reverb(/app/.*)$ $1 break;
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's 60s default would cut an idle socket before the Pusher
        # protocol's own ping/pong (activity_timeout) keeps it alive.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- PHP-FPM (Laravel) ----
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
    }

    # ---- Frontend: Vite dev server (with HMR websocket) ----
    location / {
        set $vite_upstream http://node:5173;
        proxy_pass $vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Deny dotfiles (e.g. .env) just in case. Exempt `.well-known` and Vite's
    # dev dependency cache (/node_modules/.vite/…), which the SPA needs in dev;
    # production serves a static build, so `.vite` never appears there.
    location ~ /\.(?!well-known|vite).* {
        deny all;
    }
}
