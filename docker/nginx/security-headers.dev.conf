# =============================================================
#  SccIT — security response headers, DEVELOPMENT.
#
#  Included at server level AND inside every location that sets its own
#  add_header. Nginx does NOT merge add_header across levels: a location
#  containing any add_header silently discards every inherited one, so a
#  location that forgot this include would serve the SPA with no CSP at all.
#
#  The development policy is deliberately looser than production's because the
#  page is served by the Vite dev server, not by a static build:
#
#   - 'unsafe-inline' / 'unsafe-eval' in script-src — Vite injects an inline
#     module preamble and the React Refresh runtime evaluates transformed
#     modules. Neither exists in a production build, which is why prod pins the
#     one legitimate inline script by hash instead.
#   - ws: / wss: in connect-src — the HMR websocket. Production has no HMR.
#
#  Everything else matches production, so a CSP mistake in a shared rule still
#  surfaces during development rather than only after a deploy.
# =============================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# img-src blob: is REQUIRED, not cosmetic: attachment previews are fetched over
# authenticated XHR and rendered from URL.createObjectURL(). Dropping blob:
# breaks every ticket and asset image preview.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
