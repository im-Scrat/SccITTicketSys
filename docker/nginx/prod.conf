# =============================================================
#  SccIT — PRODUCTION Nginx site.
#  Serves the pre-built static SPA (baked into this image at
#  /usr/share/nginx/html) and proxies the API to PHP-FPM.
#
#    /api, /sanctum, /up,
#    /broadcasting         -> Laravel front controller (php-fpm @ app_prod:9000)
#    /reverb/app/          -> Reverb WebSocket (reverb_prod:6001, internal only)
#    /storage/             -> user uploads (shared volume, long cache)
#    /assets/              -> content-hashed build output (immutable, 1y cache)
#    everything else       -> index.html (SPA client-side routing)
#
#  Unlike the dev site (which proxies "/" to the Vite dev server), this serves
#  a minified, code-split, gzip-compressed build with correct cache headers.
# =============================================================

# gzip: compress text responses on the wire. woff2/png/jpg are already
# compressed, so they are intentionally excluded.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Security response headers. Re-included in every location below that
    # sets its own add_header — nginx discards inherited add_header
    # directives in any block that declares one of its own.
    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS. Resolving the app upstream at request time (via the
    # $fpm_upstream variable below) means a recreated app_prod container — which
    # gets a NEW IP — is picked up automatically. A static `fastcgi_pass name:port`
    # is resolved once at startup and cached, so it would keep dialing the dead
    # old IP after any app redeploy/restart until Nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Laravel API (decoupled front controller) ----
    # Nginx has no PHP source, so SCRIPT_FILENAME is fixed to the front
    # controller path as it exists INSIDE the app container. Laravel routes
    # from REQUEST_URI (passed via fastcgi_params).
    #
    # `broadcasting` is here for private-channel authorization
    # (/broadcasting/auth). Left out, it falls through to `location /`, whose
    # try_files answers with index.html and HTTP 200 — Echo then fails on a JSON
    # parse instead of getting a clean status it could act on.
    location ~ ^/(api|sanctum|up|broadcasting)(/|$) {
        include fastcgi_params;
        set $fpm_upstream app_prod:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120s;
    }

    # ---- Reverb WebSocket (same-origin; Reverb has no published port) ----
    # Only the Pusher-protocol socket path /app/{key} is proxied; Reverb's HTTP
    # publishing API (/apps/{id}/…) stays internal to the prod network, where
    # app_prod/queue_prod call it directly. Variable upstream for the same
    # recreate-safe DNS reason as $fpm_upstream above; a variable proxy_pass
    # does no prefix substitution, hence the explicit rewrite.
    #
    # No add_header here, so the server-level security headers are inherited.
    location ^~ /reverb/app/ {
        set $reverb_upstream http://reverb_prod:6001;
        rewrite ^/reverb(/app/.*)$ $1 break;
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- User-uploaded files (shared volume with the app container) ----
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # ---- Content-hashed build assets — safe to cache forever ----
    # Vite emits filenames like index-Cz9aO7bq.js; the hash changes on every
    # content change, so a 1-year immutable cache never serves stale code.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # ---- SPA HTML shell — must revalidate so new deploys apply at once ----
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- SPA client-side routing fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny dotfiles.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
