# =============================================================
#  SccIT — PRODUCTION Nginx site.
#  Serves the pre-built static SPA (baked into this image at
#  /usr/share/nginx/html) and proxies the API to PHP-FPM.
#
#    /api, /sanctum, /up   -> Laravel front controller (php-fpm @ app_prod:9000)
#    /storage/             -> user uploads (shared volume, long cache)
#    /assets/              -> content-hashed build output (immutable, 1y cache)
#    everything else       -> index.html (SPA client-side routing)
#
#  Unlike the dev site (which proxies "/" to the Vite dev server), this serves
#  a minified, code-split, gzip-compressed build with correct cache headers.
# =============================================================

# gzip: compress text responses on the wire. woff2/png/jpg are already
# compressed, so they are intentionally excluded.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Docker's embedded DNS. Resolving the app upstream at request time (via the
    # $fpm_upstream variable below) means a recreated app_prod container — which
    # gets a NEW IP — is picked up automatically. A static `fastcgi_pass name:port`
    # is resolved once at startup and cached, so it would keep dialing the dead
    # old IP after any app redeploy/restart until Nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Laravel API (decoupled front controller) ----
    # Nginx has no PHP source, so SCRIPT_FILENAME is fixed to the front
    # controller path as it exists INSIDE the app container. Laravel routes
    # from REQUEST_URI (passed via fastcgi_params).
    location ~ ^/(api|sanctum|up)(/|$) {
        include fastcgi_params;
        set $fpm_upstream app_prod:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120s;
    }

    # ---- User-uploaded files (shared volume with the app container) ----
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ---- Content-hashed build assets — safe to cache forever ----
    # Vite emits filenames like index-Cz9aO7bq.js; the hash changes on every
    # content change, so a 1-year immutable cache never serves stale code.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---- SPA HTML shell — must revalidate so new deploys apply at once ----
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- SPA client-side routing fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny dotfiles.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
