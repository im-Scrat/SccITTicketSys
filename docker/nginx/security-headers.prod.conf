# =============================================================
#  SccIT — security response headers, PRODUCTION.
#
#  Included at server level AND inside every location that sets its own
#  add_header. Nginx does NOT merge add_header across levels: a location
#  containing any add_header silently discards every inherited one. The
#  /storage/, /assets/ and /index.html locations all set Cache-Control, so
#  each of them must include this file or it would serve no CSP at all.
#
#  ── script-src and the inline theme script ───────────────────────────────
#
#  index.html carries one inline <script>: the anti-FOUC theme resolver, which
#  must run before first paint and therefore cannot be an external file without
#  reintroducing the flash it exists to prevent. It is pinned by SHA-256 hash
#  rather than opened up with 'unsafe-inline', so this policy still blocks any
#  injected script.
#
#  THE HASH MUST MATCH frontend/index.html BYTE FOR BYTE. Editing that script
#  without updating the hash here silently breaks theming in production. The
#  regression test `tests/Feature/Security/ContentSecurityPolicyTest.php`
#  recomputes it from the source file and fails if the two drift apart.
#
#  ── The rest ─────────────────────────────────────────────────────────────
#
#   - style-src 'self'  — verified against the real build: it emits an external
#     stylesheet and zero inline <style> tags or style= attributes. React's
#     style prop writes through the CSSOM, which CSP does not govern.
#   - img-src blob: is REQUIRED, not cosmetic: attachment previews are fetched
#     over authenticated XHR and rendered from URL.createObjectURL(). Dropping
#     blob: breaks every ticket and asset image preview.
#   - data: is kept for img/font because the SVG favicon and inlined font
#     subsets use it.
#   - connect-src 'self' — the API is same-origin; there is no HMR socket here.
# =============================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-KHnCPmswdMXMIfd2MU7rik03Ca/ym4TGng/aesEHvl0='; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
