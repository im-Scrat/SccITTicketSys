# =============================================================
#  SccIT — Development stack (Docker Compose)
#  Project: AI-Powered School IT Asset & Service Management
#
#  Conventions:
#    - All resources are prefixed "sccit_" to avoid collisions
#      with other projects on this machine.
#    - Published ports bind to 127.0.0.1 only (not exposed on LAN).
#    - Services added per phase: Phase 1 = data layer (this file).
# =============================================================
name: sccit

services:
  # ---------- PostgreSQL 17 (+ pgvector for future RAG) --------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sccit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Stable initdb args
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - sccit_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sccit_network

  # ---------- Redis (cache, sessions, queues) -----------------
  redis:
    image: redis:7-alpine
    container_name: sccit_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - sccit_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sccit_network

  # ---------- Mailpit (local mail catcher) --------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: sccit_mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - sccit_mailpitdata:/data
    networks:
      - sccit_network
    # Note: the mailpit image is distroless (no shell/wget), so a
    # container healthcheck isn't practical; it's a dev-only catcher.

networks:
  sccit_network:
    name: sccit_network
    driver: bridge

volumes:
  sccit_pgdata:
    name: sccit_pgdata
  sccit_redisdata:
    name: sccit_redisdata
  sccit_mailpitdata:
    name: sccit_mailpitdata
