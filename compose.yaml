# =============================================================
#  SccIT — Development stack (Docker Compose)
#  Project: AI-Powered School IT Asset & Service Management
#
#  Conventions:
#    - All resources are prefixed "sccit_" to avoid collisions
#      with other projects on this machine.
#    - Published ports bind to 127.0.0.1 only (not exposed on LAN).
#    - Services added per phase: Phase 1 = data layer (this file).
# =============================================================
name: sccit

services:
  # ---------- PostgreSQL 17 (+ pgvector for future RAG) --------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sccit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Stable initdb args
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - sccit_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sccit_network

  # ---------- Redis (cache, sessions, queues) -----------------
  redis:
    image: redis:7-alpine
    container_name: sccit_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - sccit_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sccit_network

  # ---------- Mailpit (local mail catcher) --------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: sccit_mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - sccit_mailpitdata:/data
    networks:
      - sccit_network
    # Note: the mailpit image is distroless (no shell/wget), so a
    # container healthcheck isn't practical; it's a dev-only catcher.

  # ---------- PHP-FPM application (Laravel) -------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
      args:
        UID: 1000
        GID: 1000
    image: sccit/app:dev
    container_name: sccit_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sccit_network

  # ---------- Nginx (single-origin entrypoint) ---------------
  nginx:
    image: nginx:1.27-alpine
    container_name: sccit_nginx
    restart: unless-stopped
    depends_on:
      - app
      - node
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sccit_network

  # ---------- Queue worker (reuses the app image) ------------
  queue:
    image: sccit/app:dev
    container_name: sccit_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5", "--max-time=3600", "--sleep=3"]
    # This role runs a worker, not php-fpm, so the image's baked
    # FPM healthcheck doesn't apply — disable it.
    healthcheck:
      disable: true
    volumes:
      - ./backend:/var/www/html
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sccit_network

  # ---------- Scheduler (reuses the app image) ---------------
  scheduler:
    image: sccit/app:dev
    container_name: sccit_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    # Runs the scheduler loop, not php-fpm — disable the baked healthcheck.
    healthcheck:
      disable: true
    volumes:
      - ./backend:/var/www/html
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sccit_network

  # ---------- Node (Vite dev server, HMR) --------------------
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: development
    image: sccit/node:dev
    container_name: sccit_node
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Named volume keeps container's Linux node_modules separate from
      # the Windows host's (native binaries differ).
      - sccit_node_modules:/app/node_modules
    expose:
      - "5173"
    networks:
      - sccit_network

networks:
  sccit_network:
    name: sccit_network
    driver: bridge

volumes:
  sccit_pgdata:
    name: sccit_pgdata
  sccit_redisdata:
    name: sccit_redisdata
  sccit_mailpitdata:
    name: sccit_mailpitdata
  sccit_node_modules:
    name: sccit_node_modules
